name: Build and Publish NS8 Module

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Set lower-case image names
      - name: Set image names
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LOWER=${OWNER_LOWER}" >> $GITHUB_ENV
          echo "MODULE_NAME=ns8-simplestaff" >> $GITHUB_ENV
          echo "BACKEND_IMAGE=${{ env.REGISTRY }}/${OWNER_LOWER}/simplestaff-backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=${{ env.REGISTRY }}/${OWNER_LOWER}/simplestaff-frontend" >> $GITHUB_ENV
          echo "MODULE_IMAGE=${{ env.REGISTRY }}/${OWNER_LOWER}/ns8-simplestaff" >> $GITHUB_ENV

      # Determine SemVer version tag: use existing tag or auto-increment patch version on main push
      - name: Determine SemVer version
        id: version
        run: |
          git fetch --tags --force
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RAW_TAG="${{ github.ref_name }}"
            SEMVER="${RAW_TAG#v}"
          else
            # Check if HEAD already points to a version tag
            HEAD_TAG=$(git tag --points-at HEAD | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            if [[ -n "${HEAD_TAG}" ]]; then
              SEMVER="${HEAD_TAG#v}"
            else
              LATEST_TAG=$(git tag -l | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1 || true)
              if [[ -z "${LATEST_TAG}" ]]; then
                SEMVER="1.0.0"
              else
                IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST_TAG}"
                SEMVER="${MAJOR}.${MINOR}.$((PATCH + 1))"
              fi
              echo "Auto-tagging commit with v${SEMVER}..."
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag "v${SEMVER}"
              git push origin "refs/tags/v${SEMVER}" || true
            fi
          fi
          echo "Resolved SemVer: ${SEMVER}"
          echo "version=${SEMVER}" >> $GITHUB_OUTPUT
          echo "tag=${SEMVER}" >> $GITHUB_OUTPUT

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 1. Build & Push Backend ──
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest

      # ── 2. Build & Push Frontend ──
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest

      # ── 3. Build NS8 Cockpit UI on Runner ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Enable Corepack
        run: corepack enable

      - name: Install UI dependencies
        working-directory: ./ui
        run: yarn install

      - name: Build UI
        working-directory: ./ui
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          yarn lint --fix || true
          yarn build

      # ── 4. Build & Push NS8 Module Installer Image ──
      - name: Build and push NS8 Module image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            IMAGE_TAG=${{ steps.version.outputs.tag }}
          tags: |
            ${{ env.MODULE_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.MODULE_IMAGE }}:latest

      # ── 5. Ensure GitHub Release exists ──
      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMVER: ${{ steps.version.outputs.tag }}
        run: |
          RELEASE_TAG="v${SEMVER}"
          if ! gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --repo "${{ github.repository }}" --title "Release ${SEMVER}" --generate-notes --latest || true
          fi

      # ── 6. Update NS8 Software Center Repository (repomd branch) ──
      - name: Update NS8 Software Repository (repomd)
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          MODULE_OWNER: ${{ env.OWNER_LOWER }}
          MODULE_NAME: ${{ env.MODULE_NAME }}
          CURRENT_TAG: ${{ steps.version.outputs.tag }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q skopeo jq
          trap 'skopeo logout ghcr.io || true' EXIT
          skopeo login -u "${REGISTRY_USER}" --password-stdin ghcr.io <<<"${REGISTRY_TOKEN}"

          python3 - <<'EOF'
          import json
          import os
          import re
          import subprocess
          import sys

          SEMVER_RE = re.compile(
              r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?"
              r"(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$"
          )

          def parse_semver(tag):
              m = SEMVER_RE.match(tag)
              if not m:
                  return None
              major, minor, patch = int(m.group(1)), int(m.group(2)), int(m.group(3))
              prerelease = m.group(4)
              is_stable = 1 if prerelease is None else 0
              return (major, minor, patch, is_stable, prerelease or "")

          owner = os.environ["MODULE_OWNER"]
          name = os.environ["MODULE_NAME"]
          current_tag = os.environ["CURRENT_TAG"]
          source = f"ghcr.io/{owner}/{name}"
          print(f"Inspecting tags of {source} ...", file=sys.stderr)

          proc = subprocess.run(
              ["skopeo", "inspect", f"docker://{source}:{current_tag}"],
              capture_output=True, text=True, check=True
          )

          repo_inspect = json.loads(proc.stdout)
          repo_tags = repo_inspect.get("RepoTags", [])
          if current_tag not in repo_tags and parse_semver(current_tag):
              repo_tags.append(current_tag)

          valid_tags = [t for t in repo_tags if parse_semver(t) is not None]
          semver_tags = sorted(valid_tags, key=parse_semver, reverse=True)

          versions = []
          testing_found = False
          for tag in semver_tags:
              sv = parse_semver(tag)
              is_prerelease = (sv[3] == 0)
              if testing_found and is_prerelease:
                  continue

              insp = subprocess.run(
                  ["skopeo", "inspect", f"docker://{source}:{tag}"],
                  capture_output=True, text=True, check=True
              )
              labels = json.loads(insp.stdout).get("Labels", {})
              versions.append({
                  "tag": tag,
                  "testing": is_prerelease,
                  "labels": labels,
              })

              if not is_prerelease:
                  break
              else:
                  testing_found = True

          if not versions:
              print("ERROR: No valid SemVer tags found in registry!", file=sys.stderr)
              sys.exit(1)

          with open("ui/public/metadata.json", "r", encoding="utf-8") as mf:
              meta = json.load(mf)

          display_name = meta.get("display_name") or meta.get("name", "SimpleStaff")
          pkg = {
              "id": name,
              "name": display_name,
              "upstream_name": meta.get("upstream_name", "SimpleStaff"),
              "description": meta.get("description", {"en": "SimpleStaff for NethServer 8"}),
              "logo": "logo.png",
              "screenshots": [],
              "categories": meta.get("categories", ["web", "office"]),
              "authors": meta.get("authors", []),
              "docs": meta.get("docs", {}),
              "source": source,
              "versions": versions,
          }

          os.makedirs(f".repomd/{name}", exist_ok=True)
          with open(".repomd/repodata.json", "w", encoding="utf-8") as rf:
              json.dump([pkg], rf, separators=(",", ":"))

          repo_meta = dict(meta)
          repo_meta["name"] = display_name
          with open(f".repomd/{name}/metadata.json", "w", encoding="utf-8") as rmf:
              json.dump(repo_meta, rmf, indent=2)

          print("Generated repodata.json:", json.dumps([pkg], indent=2), file=sys.stderr)
          EOF

          cp -f ui/src/assets/module_default_logo.png ".repomd/${MODULE_NAME}/logo.png"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .repomd/
          TREE=$(git write-tree --prefix=.repomd)
          COMMIT=$(git commit-tree -m "repomd: update metadata for ${CURRENT_TAG}" "${TREE}")
          git push -f origin "${COMMIT}:refs/heads/repomd"
